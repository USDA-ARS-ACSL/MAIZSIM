name: Trivy Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  #schedule:
    #- cron: "0 12 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read
  
jobs:
  repo_scan:
    name: Repo scan (vuln + secrets + config)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Trivy FS + Config scan (SARIF)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,config
          format: sarif
          output: trivy-fs.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          version: v0.70.0
          #exit-code: 1           # <--- This fails the step if HIGH/CRITICAL vulns found. Commented out because in Public Repo we will be able to upload to GH Code Security and will get notification in pull requests.

      - name: Upload repo scan artifact
        uses: actions/upload-artifact@v7
        #if: ${{ always() }}         # <--- This runs regardless of prior step failures. De-activated because exit code line is commented out.
        with:
          name: trivy-fs
          path: trivy-fs.sarif
     
      #ACTIVATE Section Below once repository has become public to allow upload to GitHub Code Scanning.
      - name: Upload SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-fs.sarif
      
  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Generate SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: cyclonedx
          output: sbom.cdx.json
          version: v0.70.0

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v7
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
  
